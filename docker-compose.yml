version: "3.9"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pricing
      POSTGRES_PASSWORD: pricing
      POSTGRES_DB: pricing
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricing -d pricing"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgres://pricing:pricing@db:5432/pricing?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    command: ["/app/migrate", "-direction", "up"]

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: api
    environment:
      DATABASE_URL: postgres://pricing:pricing@db:5432/pricing?sslmode=disable
      LISTEN_ADDR: ":8080"
      BUILD_COMMIT: dev
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  seed:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: seed
    environment:
      DATABASE_URL: postgres://pricing:pricing@db:5432/pricing?sslmode=disable
    depends_on:
      api:
        condition: service_healthy
    command: ["/app/seed"]

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  pgdata:
